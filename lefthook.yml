commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-commit:
  jobs:
    - name: biome-check
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bunx biome ci --no-errors-on-unmatched .
    - name: typecheck
      run: bunx tsc --noEmit
    - name: test
      run: bun test
