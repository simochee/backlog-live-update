name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      # .node-version と lockfile に固定したツールを使い、ローカルと CI の差をなくす。
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec biome ci --no-errors-on-unmatched .
      - run: vp run compile
      - run: vp test run
      - run: vp run build
      - run: vp run build:firefox
      - run: vp run lint:firefox
